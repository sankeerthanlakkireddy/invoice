<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>New Invoice Creator</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .container { border: 1px solid #ccc; padding: 20px; border-radius: 5px; max-width: 500px; margin: 20px auto; }
        h2 { border-bottom: 2px solid #eee; padding-bottom: 10px; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input[type="text"], input[type="email"], input[type="number"], input[type="date"], button { padding: 10px; margin-top: 5px; width: 100%; box-sizing: border-box; }
        button { background-color: #007BFF; color: white; border: none; cursor: pointer; margin-top: 20px; }
        .message { margin-top: 15px; padding: 10px; border-radius: 4px; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzphBAvld6DEi5sjRI0Yl8-0xPt-B-ZijP-DmPbUSfrld4F4wNXOLqVJpGO_J1u8wpVzw/exec"; 
    </script>

    <div class="container">
        <h2>Generate New Invoice 📝</h2>
        <div id="submissionMessage" class="message" style="display:none;"></div>
        
        <form id="invoiceForm">
            <label for="name">Client Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Client Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Client Phone (for WhatsApp):</label>
            <input type="text" id="phone" name="phone" placeholder="e.g., 919876543210" required>

            <label for="service">Service/Item Billed:</label>
            <input type="text" id="service" name="service" required>

            <label for="amount">Amount ($):</label>
            <input type="number" id="amount" name="amount" step="0.01" required>
            
            <label for="dateCreated">Date Created:</label>
            <input type="date" id="dateCreated" name="dateCreated" required>

            <button type="submit">Create & Save Invoice</button>
        </form>
    </div>

    <script>
        const invoiceForm = document.getElementById('invoiceForm');
        const subMsg = document.getElementById('submissionMessage');

        invoiceForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            subMsg.style.display = 'block';
            subMsg.className = 'message';
            subMsg.textContent = 'Creating Invoice...';

            // Use FormData to capture all fields
            const formData = new URLSearchParams(new FormData(invoiceForm));
            
            // New action parameter for Apps Script
            formData.append('action', 'createInvoice'); 
            
            // Append default values expected by the sheet
            formData.append('status', 'Pending'); 
            formData.append('emailSent', ''); 
            
            try {
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.success) {
                    subMsg.className = 'message success';
                    subMsg.textContent = result.message;
                    invoiceForm.reset(); // Clear the form on success
                } else {
                    subMsg.className = 'message error';
                    subMsg.textContent = 'Invoice Creation Failed: ' + result.message;
                }
            } catch (error) {
                subMsg.className = 'message error';
                subMsg.textContent = 'An error occurred during submission.';
            }
        });
    </script>
</body>
</html>
