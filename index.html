<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Booking & Invoice Manager</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .container { margin-bottom: 40px; border: 1px solid #ccc; padding: 15px; border-radius: 5px; max-width: 900px; margin: 20px auto; }
        h2 { border-bottom: 2px solid #eee; padding-bottom: 10px; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input[type="text"], input[type="email"], input[type="date"], button { padding: 8px; margin-top: 5px; box-sizing: border-box; }
        input[type="text"], input[type="email"], input[type="date"] { width: 100%; }
        button { background-color: #007BFF; color: white; border: none; cursor: pointer; margin-top: 15px; }
        #resultsTable { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.9em; }
        #resultsTable th, #resultsTable td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        #resultsTable button { padding: 5px 10px; margin: 0; width: auto; background-color: #28a745; }
        .success { color: green; font-weight: bold; }
        .error { color: red; font-weight: bold; }
    </style>
</head>
<body>

    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyRTNJqq7uDmxdttPr-4W98vMwUg88k1CGQ37ghrriRtm27hCCjBxRmC3WHeoUjnVCdkQ/exec"; 
    </script>

    <div class="container">
        <h2>Submit New Booking (Quick Entry) 📥</h2>
        <div id="submissionMessage"></div>
        <form id="submissionForm">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="phone">Phone:</label>
            <input type="text" id="phone" name="phone" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="bookedDate">Date of Booked:</label>
            <input type="date" id="bookedDate" name="bookedDate" required>

            <button type="submit">Submit Booking</button>
        </form>
    </div>

    <div class="container">
        <h2>Retrieve Data & Action Invoices 📅</h2>
        <div id="retrievalMessage"></div>
        <form id="retrievalForm">
            <label for="searchDate">Search Bookings by Date:</label>
            <input type="date" id="searchDate" name="searchDate" required>
            
            <button type="submit">Retrieve Data</button>
        </form>
        
        <h3>Search Results:</h3>
        <table id="resultsTable">
            <thead>
                <tr>
                    <th>Invoice ID</th> 
                    <th>Name</th>
                    <th>Email</th>
                    <th>Amount</th>
                    <th>Status</th>
                    <th>Action</th> 
                </tr>
            </thead>
            <tbody id="resultsBody">
                </tbody>
        </table>
    </div>

    <script>
        const submissionForm = document.getElementById('submissionForm');
        const retrievalForm = document.getElementById('retrievalForm');
        const resultsBody = document.getElementById('resultsBody');
        const subMsg = document.getElementById('submissionMessage');
        const retMsg = document.getElementById('retrievalMessage');

        // --- SUBMISSION LOGIC (POST Request for Simple Booking) ---
        submissionForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            subMsg.className = '';
            subMsg.textContent = 'Submitting...';

            const formData = new URLSearchParams(new FormData(submissionForm));
            formData.append('action', 'submitBooking'); // Routes to handleBookingSubmission()

            try {
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.success) {
                    subMsg.className = 'success';
                    subMsg.textContent = result.message + " Check your Google Sheet!";
                    submissionForm.reset(); 
                } else {
                    subMsg.className = 'error';
                    subMsg.textContent = 'Submission Failed: ' + result.message;
                }
            } catch (error) {
                subMsg.className = 'error';
                subMsg.textContent = 'An error occurred during submission.';
            }
        });

        // --- RETRIEVAL LOGIC (GET Request) ---
        retrievalForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            resultsBody.innerHTML = ''; 
            retMsg.className = '';
            retMsg.textContent = 'Searching...';

            const searchDate = document.getElementById('searchDate').value;
            const fullUrl = APPS_SCRIPT_URL + '?searchDate=' + searchDate;

            try {
                const response = await fetch(fullUrl, { method: 'GET' });
                const result = await response.json();

                if (result.success) {
                    retMsg.className = 'success';
                    retMsg.textContent = `Found ${result.data.length} booking(s) for ${searchDate}.`;
                    
                    if (result.data.length > 0) {
                        result.data.forEach(booking => {
                            const row = resultsBody.insertRow();
                            
                            // Ensure these keys match the headers in your Google Sheet!
                            const invoiceId = booking['Invoice ID'] || 'N/A';
                            const status = booking['Status'] || 'Pending';
                            const amount = booking['Amount'] || '0.00';
                            
                            row.insertCell().textContent = invoiceId;
                            row.insertCell().textContent = booking['Name'];
                            row.insertCell().textContent = booking['Email'];
                            row.insertCell().textContent = `$${amount}`;
                            row.insertCell().textContent = status;
                            
                            // Create the Action Button Column
                            const actionCell = row.insertCell();
                            
                            if (status.toLowerCase() === 'paid') {
                                actionCell.textContent = 'Email Sent ✅';
                                actionCell.style.color = 'green';
                            } else {
                                const button = document.createElement('button');
                                button.textContent = 'Mark Paid & Send';
                                // Calls the function below to trigger the update
                                button.onclick = () => sendInvoiceEmail(invoiceId, status);
                                actionCell.appendChild(button);
                            }
                        });
                    }
                } else {
                    retMsg.className = 'error';
                    retMsg.textContent = 'Retrieval Failed: ' + result.message;
                }
            } catch (error) {
                retMsg.className = 'error';
                retMsg.textContent = 'Network Error: Could not retrieve data.';
            }
        });


        // --- Function to handle the Invoice update and trigger email (action: sendInvoice) ---
        async function sendInvoiceEmail(invoiceId, currentStatus) {
            if (currentStatus.toLowerCase() === 'paid') {
                alert(`Invoice #${invoiceId} is already marked as Paid.`);
                return;
            }

            const confirmation = confirm(`Mark Invoice #${invoiceId} as PAID and send confirmation?`);
            
            if (!confirmation) {
                return;
            }

            const retMsg = document.getElementById('retrievalMessage');
            retMsg.className = '';
            retMsg.textContent = `Processing Invoice #${invoiceId}...`;

            const payload = new URLSearchParams();
            payload.append('action', 'sendInvoice'); // Routes to updateAndSendInvoice()
            payload.append('invoiceId', invoiceId);
            payload.append('status', 'Paid'); 

            try {
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    body: payload
                });

                const result = await response.json();

                if (result.success) {
                    retMsg.className = 'success';
                    retMsg.textContent = result.message;
                    // Re-search to refresh the status in the table
                    document.getElementById('retrievalForm').dispatchEvent(new Event('submit'));
                } else {
                    retMsg.className = 'error';
                    retMsg.textContent = 'Action Failed: ' + result.message;
                }

            } catch (error) {
                retMsg.className = 'error';
                retMsg.textContent = 'Network Error: Could not reach the server.';
            }
        }
    </script>
</body>
</html>
