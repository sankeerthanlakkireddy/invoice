<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Invoice Generation</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .container { border: 1px solid #ccc; padding: 20px; border-radius: 5px; max-width: 500px; margin: 20px auto; }
        h2 { border-bottom: 2px solid #eee; padding-bottom: 10px; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input[type="text"], input[type="email"], input[type="number"], input[type="date"], select, button { padding: 10px; margin-top: 5px; width: 100%; box-sizing: border-box; }
        button { background-color: #4CAF50; color: white; border: none; cursor: pointer; margin-top: 20px; }
        #status { border: 2px solid #ccc; }
        .message { margin-top: 15px; padding: 10px; border-radius: 4px; display: none; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxsf4LfjsBwjyM6eSa41TvXU6gJ5TdVB5uSuPlXRpAHpYOKHaE1HoR78J3XRRkdFOdW/exec"; 
    </script>

    <div class="container">
        <h2>Generate New Invoice 📝</h2>
        <div id="submissionMessage" class="message"></div>
        
        <form id="invoiceForm">
            <label for="name">Client Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Client Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Client Phone:</label>
            <input type="text" id="phone" name="phone" required>

            <label for="service">Main Service Description:</label>
            <input type="text" id="service" name="service" value="Dead Animal removal" required>

            <label for="amount">Amount ($):</label>
            <input type="number" id="amount" name="amount" step="0.01" value="250.00" required>
            
            <label for="dateCreated">Date Created:</label>
            <input type="date" id="dateCreated" name="dateCreated" required>

            <label for="status">Payment Status:</label>
            <select id="status" name="status" required>
                <option value="Pending">Pending</option>
                <option value="Paid">Paid (Send PDF Email)</option>
                <option value="Cancelled">Cancelled</option>
            </select>

            <button type="submit">Create Invoice & Send Email</button>
        </form>
    </div>

    <script>
        const invoiceForm = document.getElementById('invoiceForm');
        const subMsg = document.getElementById('submissionMessage');

        invoiceForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            subMsg.style.display = 'block';
            subMsg.className = 'message';
            subMsg.textContent = 'Processing Invoice...';

            const formData = new URLSearchParams(new FormData(invoiceForm));

            try {
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.success) {
                    subMsg.className = 'message success';
                    subMsg.textContent = result.message;
                    invoiceForm.reset(); 
                } else {
                    subMsg.className = 'message error';
                    subMsg.textContent = 'Invoice Creation Failed: ' + result.message;
                }
            } catch (error) {
                subMsg.className = 'message error';
                subMsg.textContent = 'An error occurred during submission.';
            }
        });
    </script>
</body>
</html>
