<!DOCTYPE html>
<html>
  <head>
    <title>External Invoice Generator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.1/css/bootstrap.min.css" />
    <style>
      body { padding: 40px; background-color: #f4f4f9; }
      .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 600px; }
      h2 { text-align: center; margin-bottom: 20px; color: #333; }
      .loader { display: none; text-align: center; margin-top: 10px; }
    </style>
  </head>
  <body>

    <div class="container">
      <h2>External Invoice Generator 🧾</h2>
      
      <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz-bpYik4VkYEZ9P-hLynRcyX07rMMqCPeWq0Bst4rXdd2hEJuZKQVb9ED73Qq8lfDGxQ/exec"; 
      </script>h

      <form id="invoiceForm">
        
        <div class="form-group">
          <label>Customer Name</label>
          <input type="text" class="form-control" name="customerName" required>
        </div>

        <div class="form-row">
          <div class="form-group col-md-6">
            <label>Phone Number</label>
            <input type="tel" class="form-control" name="phoneNumber" required>
          </div>
          <div class="form-group col-md-6">
            <label>Email Address</label>
            <input type="email" class="form-control" name="customerEmail" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group col-md-6">
            <label>Date of Booking</label>
            <input type="date" class="form-control" name="bookingDate" required>
          </div>
          <div class="form-group col-md-6">
            <label>Amount ($)</label>
            <input type="number" step="0.01" class="form-control" name="amount" required>
          </div>
        </div>

        <div class="form-group">
          <label>Payment Status</label>
          <select class="form-control" name="paymentStatus" id="statusSelect" onchange="toggleButtonText()">
            <option value="Pending">Pending / Unpaid</option>
            <option value="Paid">Paid</option>
          </select>
          <small class="text-muted">Invoice is emailed only if status is "Paid".</small>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Save Data</button>
        
        <div class="loader" id="loader">
           <div class="spinner-border text-primary" role="status"></div>
           <p>Processing...</p>
        </div>
      </form>
    </div>

    <script>
      // Attach the submission handler to the form
      document.getElementById('invoiceForm').addEventListener('submit', handleFormSubmit);

      function toggleButtonText() {
        var status = document.getElementById("statusSelect").value;
        var btn = document.getElementById("submitBtn");
        if(status === "Paid") {
          btn.innerHTML = "Save & Send Invoice";
          btn.classList.remove("btn-primary");
          btn.classList.add("btn-success");
        } else {
          btn.innerHTML = "Save Data Only";
          btn.classList.remove("btn-success");
          btn.classList.add("btn-primary");
        }
      }
      
      async function handleFormSubmit(event) {
        event.preventDefault(); // Stop the standard form submission
        
        if (APPS_SCRIPT_URL.includes("YOUR_NEW_DEPLOYMENT_URL_HERE")) {
          alert("ERROR: Please update the APPS_SCRIPT_URL in the HTML file with your deployed script URL.");
          return;
        }

        document.getElementById("submitBtn").disabled = true;
        document.getElementById("loader").style.display = "block";

        const form = event.target;
        const formData = new FormData(form);
        
        // Convert form data to a plain JavaScript object
        const data = Object.fromEntries(formData.entries());

        try {
            await fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                // Use 'no-cors' for simple external submissions to bypass complex preflight checks
                mode: 'no-cors', 
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            });

            // Since we use 'no-cors', we can't read the server's message, 
            // so we show a general success alert.
            onSuccess("Success: Data request sent. Check your sheet for Invoice ID!");

        } catch (error) {
            onFailure(error);
        }
      }

      function onSuccess(msg) {
        document.getElementById("invoiceForm").reset();
        document.getElementById("loader").style.display = "none";
        document.getElementById("submitBtn").disabled = false;
        toggleButtonText(); // Reset button style
        alert(msg);
      }

      function onFailure(error) {
        document.getElementById("loader").style.display = "none";
        document.getElementById("submitBtn").disabled = false;
        alert("Error: Failed to communicate with the Apps Script server. Check the URL and deployment: " + error);
      }
    </script>
  </body>
</html>
